name: App checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen-and-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Screening and photo regression checks
        run: |
          node tests/engine.test.cjs
          node tests/vision.test.cjs
          node tests/app.test.cjs
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real photo and OCR in a mobile browser viewport
        run: node tests/browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-check-screenshots
          path: test-artifacts/
          retention-days: 7
