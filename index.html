<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="English and Vietnamese food-allergen screening with personal profiles and source-linked molecular references."><meta name="theme-color" content="#126a66"><title>AllergenGuard · AI Allergen Detector</title><link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css?v=10.1"></head>
<body><a class="skip" href="#main" data-i18n="skip"></a>
<header class="header"><div class="brand"><span class="brand-icon" aria-hidden="true">+</span><div><strong>AllergenGuard</strong><span data-i18n="brandSub"></span></div></div><div class="header-tools"><label class="sr-only" for="language" data-i18n="language"></label><select id="language"><option value="en">English</option><option value="vi">Tiếng Việt</option></select><button id="aboutBtn" class="quiet" data-i18n="about"></button></div></header>
<main id="main" class="shell"><div class="intro"><div><span class="eyebrow" data-i18n="eyebrow"></span><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p></div><span class="local-pill">● <span data-i18n="local"></span></span></div>
<div id="notice" class="notice" role="status" hidden></div><nav class="navigation" aria-label="Sections"><button data-view="screen" class="active" data-i18n="screen"></button><button data-view="profile" data-i18n="profile"></button><button data-view="history" data-i18n="history"></button></nav>
<section id="screenView"><div class="profile-strip"><div><span class="eyebrow" data-i18n="activeProfile"></span><div id="profileSummary"></div></div><button id="editProfile" class="secondary" data-i18n="editProfile"></button></div>
<div class="workspace"><section class="panel input-panel"><div class="section-heading"><span class="step">01</span><h2 data-i18n="checkFood"></h2></div><div class="segmented"><button id="labelMode" class="selected" aria-pressed="true" data-i18n="label"></button><button id="menuMode" aria-pressed="false" data-i18n="menu"></button></div>
<label class="field-label" for="textInput" data-i18n="ingredients"></label><textarea id="textInput" rows="7" maxlength="20000" data-placeholder="inputPlaceholder"></textarea><div class="input-tools"><button id="exampleBtn" class="link" data-i18n="example"></button><span id="charCount" class="muted">0 / 20,000</span></div>
<details id="photoTools"><summary data-i18n="photo"></summary><div class="photo-content"><label class="field-label" for="imageInput" data-i18n="choosePhoto"></label><input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,image/bmp" capture="environment"><img id="preview" alt="" hidden><label class="field-label" for="ocrLanguage" data-i18n="ocrLanguage"></label><select id="ocrLanguage"><option value="eng">English</option><option value="vie">Tiếng Việt</option><option value="eng+vie">English + Tiếng Việt</option></select><div class="button-row"><button id="ocrBtn" class="secondary" data-i18n="readLabel" disabled></button><button id="cancelOcr" class="quiet" data-i18n="cancel" hidden></button></div><p class="hint" data-i18n="ocrHint"></p><div id="ocrStatus" class="hint" role="status"></div><details class="advanced"><summary data-i18n="visionTitle"></summary><p class="hint" data-i18n="visionHint"></p><button id="visionBtn" class="secondary" data-i18n="identify" disabled></button><div id="visionStatus" class="hint" role="status"></div></details></div></details>
<div id="ocrReview" class="notice" hidden><label><input type="checkbox" id="confirmOcr"><span data-i18n="confirmOcr"></span></label></div><button id="analyzeBtn" class="primary full" data-i18n="analyze"></button><p class="hint" data-i18n="inputHint"></p></section>
<section class="panel results-panel" aria-live="polite"><div class="section-heading"><span class="step">02</span><h2 data-i18n="assessment"></h2></div><div id="result"></div></section></div></section>
<section id="profileView" hidden><div class="panel"><div class="section-heading"><span class="step">+</span><h2 data-i18n="profileTitle"></h2></div><p class="muted" data-i18n="profileIntro"></p><div class="profile-info"><label><span class="field-label" data-i18n="nickname"></span><input id="profileName" type="text" maxlength="60" data-placeholder="nicknamePlaceholder"></label><label class="check"><input id="severeHistory" type="checkbox"><span data-i18n="severeHistory"></span></label></div>
<details class="reaction-history"><summary data-i18n="reactionNotes"></summary><label class="sr-only" for="reactionNotes" data-i18n="reactionNotes"></label><textarea id="reactionNotes" rows="3" maxlength="1000" data-placeholder="reactionPlaceholder"></textarea></details>
<div class="catalog-tools"><label class="search"><span class="sr-only" data-i18n="search"></span><input id="profileSearch" type="search" data-placeholder="search"></label><label><span class="sr-only" data-i18n="category"></span><select id="categoryFilter"><option value="all" data-i18n="allFoods"></option><option value="seafood" data-i18n="seafood"></option><option value="plant" data-i18n="plant"></option><option value="animal" data-i18n="animal"></option><option value="fruit" data-i18n="fruit"></option><option value="other" data-i18n="other"></option></select></label></div><p class="hint" id="catalogCount"></p><div id="catalog" class="catalog"></div>
<details class="custom-section"><summary data-i18n="customTitle"></summary><p class="hint" data-i18n="customHint"></p><div class="custom-form"><label><span data-i18n="foodName"></span><input id="customName" maxlength="80"></label><label><span data-i18n="aliases"></span><input id="customAliases" maxlength="250"></label><button id="addCustom" class="secondary" data-i18n="add"></button></div><div id="customList"></div></details>
<details class="custom-section"><summary data-i18n="conditions"></summary><p class="hint" data-i18n="conditionsHint"></p><label class="check"><input id="conditionLactose" type="checkbox"><span data-i18n="lactose"></span></label><label class="check"><input id="conditionCoeliac" type="checkbox"><span data-i18n="coeliac"></span></label></details><div class="profile-footer"><span id="selectionCount" class="muted"></span><button id="saveProfile" class="primary" data-i18n="saveProfile"></button></div></div></section>
<section id="historyView" hidden><div class="panel"><div class="history-head"><h2 data-i18n="history"></h2><div class="button-row"><button id="exportCsv" class="secondary" data-i18n="csv"></button><button id="printReport" class="secondary" data-i18n="print"></button><button id="clearHistory" class="quiet" data-i18n="clear"></button></div></div><p class="hint" data-i18n="historyHint"></p><div id="historyList"></div><div class="button-row"><button id="backupData" class="link" data-i18n="backup"></button><label class="link file-label"><span data-i18n="restore"></span><input type="file" id="restoreData" accept="application/json,.json" hidden></label></div></div></section>
<footer><p data-i18n="footer"></p><span>Aditya Rai &amp; Team · v10.1</span><button id="textSize" class="link" data-i18n="textSize"></button></footer></main>
<dialog id="aboutDialog"><div class="dialog-head"><h2 data-i18n="aboutTitle"></h2><button id="closeAbout" class="quiet" data-i18n="close"></button></div><p data-i18n="aboutText"></p><p data-i18n="coverage"></p><p data-i18n="moleculeDisclaimer"></p><h3 data-i18n="sources"></h3><ul id="sourcesList"></ul><p class="hint" data-i18n="privacy"></p></dialog>
<script src="database.js?v=10.1"></script><script src="catalog.js?v=10.1"></script><script src="engine.js?v=10.1"></script><script src="i18n.js?v=10.1"></script><script src="app.js?v=10.1"></script></body></html>
